name: build

# Builds a ref of this repository headless on Linux.
#   flavor=baseline  plain release build, no testcases (reference result)
#   flavor=tests     release build with testcases, runs the device testcases
#   flavor=sanitize  like tests, with the device testcase and what is compiled
#                    into it built with AddressSanitizer and
#                    UndefinedBehaviorSanitizer
# Started through the API (workflow_dispatch) because the code branches do
# not carry workflow files.

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch, tag or commit of the source to build"
        required: true
        default: main
      flavor:
        description: "baseline, tests or sanitize"
        required: true
        default: baseline
      kmk_args:
        description: "Extra arguments for kmk (optional)"
        required: false
        default: ""
      cache_ref:
        description: "Branch whose baseline build output is reused (tests and sanitize flavors)"
        required: false
        default: main
      fuzz_models:
        description: "Number of random device models for the fuzz test (default: 2000, with sanitize 20000)"
        required: false
        default: ""
      fuzz_seed:
        description: "Seed of the first random device model (default: the one built into the testcase)"
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: build-${{ inputs.ref }}-${{ inputs.flavor }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 330
    env:
      DEBIAN_FRONTEND: noninteractive
    steps:
      - name: Runner facts
        run: |
          set -x
          uname -a
          nproc
          free -g
          df -h / /mnt || true
          gcc --version | head -1
          ls -l /dev/kvm || true

      - name: Check out source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          submodules: recursive
          fetch-depth: 50

      - name: Source facts
        id: src
        run: |
          echo "head=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "kbuild=$(git -C kBuild rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          # The build takes the product revision from a trailer in the commit message of
          # HEAD, which commits made in this fork do not have; use the newest upstream one.
          rev=$(git log -50 --format=%B | grep -m1 -o -E '^svn:sync-xref-src-repo-rev: r[0-9]+$' | grep -o -E '[0-9]+$')
          test -n "$rev"
          echo "VBOX_SVN_REV=$rev" >> "$GITHUB_ENV"
          echo "revision $rev"
          # The commit whose build output can be reused.
          if [ "${{ inputs.flavor }}" = "baseline" ]; then
            base=$(git rev-parse HEAD)
          else
            base=$(git ls-remote origin "refs/heads/${{ inputs.cache_ref }}" | cut -f1)
            git fetch -q --depth=1 origin "$base"
          fi
          echo "base=$base" >> "$GITHUB_OUTPUT"
          echo "gcc=$(gcc -dumpfullversion)" >> "$GITHUB_OUTPUT"
          # Give every source file the same old time stamp, then mark what differs
          # from the base as new. Together with the cached output directory of the
          # base this makes the build incremental.
          find . '(' -path ./out -o -name .git ')' -prune -o -type f -print0 | xargs -0 touch -h -d @1577836800
          if [ "$base" != "$(git rev-parse HEAD)" ]; then
            git diff --name-only "$base" HEAD | tee changed-files.log | xargs -r touch
          fi
          git log -1 --format='%H %s'
          ls kBuild/kBuild/bin/linux.amd64 | head -5

      - name: Install build dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends \
            build-essential gcc-multilib g++-multilib libc6-dev-i386 \
            pkg-config \
            acpica-tools chrpath nasm yasm xsltproc libxml2-utils genisoimage makeself \
            glslang-tools python3 python3-dev gdb \
            libasound2-dev libcap-dev libcurl4-openssl-dev libdevmapper-dev \
            libpam0g-dev libpulse-dev libssl-dev zlib1g-dev libzstd-dev \
            libxml2-dev libxslt1-dev libvpx-dev libopus-dev libogg-dev libvorbis-dev \
            liblzf-dev liblzma-dev libtpms-dev libpng-dev libjpeg-dev \
            libslirp-dev libssh-dev libvncserver-dev \
            libx11-dev libxext-dev libxmu-dev libxrandr-dev libxinerama-dev \
            libxcursor-dev libxcomposite-dev libxfixes-dev libxt-dev \
            libgl-dev libglu1-mesa-dev mesa-common-dev libvulkan-dev \
            linux-headers-$(uname -r) || \
          sudo apt-get install -y -q --no-install-recommends linux-headers-generic

      - name: Restore build output of the base
        id: outcache
        if: inputs.flavor != 'baseline'
        uses: actions/cache/restore@v4
        with:
          path: out
          key: out-v1-gcc${{ steps.src.outputs.gcc }}-${{ steps.src.outputs.base }}

      - name: Configure
        run: |
          export KBUILD_PATH="$PWD/kBuild/kBuild"
          # The runner image ships libstdc++ headers of several GCC versions and
          # configure picks the first it finds; keep only those of the default g++.
          gccmaj=$(g++ -dumpversion | cut -d. -f1)
          for d in /usr/include/c++/* /usr/include/x86_64-linux-gnu/c++/*; do
            [ "$(basename "$d")" = "$gccmaj" ] || sudo rm -rf "$d"
          done
          ls /usr/include/c++
          ./configure --help > configure-help.log 2>&1 || true
          # The tool checks of configure run into their time limits now and then, so
          # it gets up to three attempts.
          configured=no
          for attempt in 1 2 3; do
            if ./configure --ose --build-headless --disable-docs --disable-additions \
                 --disable-validationkit --disable-python --disable-hardening \
                 --disable-extpack --disable-sdl \
                 > configure-run.log 2>&1; then
              configured=yes
              break
            fi
            echo "configure attempt $attempt failed:"; grep -E 'ERROR|failed' configure-run.log | head -5 || true
          done
          if [ "$configured" != yes ]; then cat configure-run.log; tail -100 configure.log || true; exit 1; fi
          cat configure-run.log
          echo "---- AutoConfig.kmk"; cat AutoConfig.kmk
          echo "---- env.sh"; cat env.sh

      - name: Local configuration
        run: |
          {
            echo "VBOX_WITH_DOCS :="
            echo "VBOX_WITH_ADDITIONS :="
            echo "VBOX_WITH_VALIDATIONKIT :="
            echo "VBOX_WITH_WEBSERVICES :="
            echo "VBOX_WITH_UPDATE_AGENT :="
            echo "VBOX_WITH_TESTCASES :="
          } > LocalConfig.kmk
          cat LocalConfig.kmk
          touch -d @1577836800 LocalConfig.kmk AutoConfig.kmk env.sh

      - name: Build
        run: |
          . ./env.sh
          which kmk
          kmk --version > kmk-version.log 2>&1 || true
          sed -n '1,3p' kmk-version.log
          ( time kmk -j"$(nproc)" KBUILD_TYPE=release ${{ inputs.kmk_args }} ) > build.log 2>&1 \
            || { echo "BUILD FAILED"; grep -n -E '(^|[^a-zA-Z])(error|Error|\*\*\*)[: ]' build.log | head -60; echo ----; tail -120 build.log; exit 1; }
          tail -15 build.log
          grep -c -E 'warning:' build.log || true

      - name: Save build output
        if: inputs.flavor == 'baseline'
        uses: actions/cache/save@v4
        with:
          path: out
          key: out-v1-gcc${{ steps.src.outputs.gcc }}-${{ steps.src.outputs.base }}

      - name: Build result facts
        if: always()
        run: |
          ls out/linux.amd64/release/bin 2>/dev/null | head -80 || true
          du -sh out 2>/dev/null || true
          df -h /

      - name: Build device testcases
        if: inputs.flavor != 'baseline'
        run: |
          . ./env.sh
          # The sanitizers go in through properties of the target which the makefile
          # doesn't set, so nothing has to be changed in the source tree for them.
          extra=()
          if [ "${{ inputs.flavor }}" = "sanitize" ]; then
            san="-fsanitize=address,undefined -fno-omit-frame-pointer"
            extra=("tstDevPciVfio_CXXFLAGS.linux=$san" "tstDevPciVfio_LDFLAGS.linux=$san")
          fi
          ( time kmk -C src/VBox/Devices -k -j"$(nproc)" KBUILD_TYPE=release VBOX_WITH_TESTCASES=1 "${extra[@]}" ) > build-tests.log 2>&1 \
            || { echo "TESTCASE BUILD FAILED"; grep -n -E 'error:|undefined reference|multiple definition|ld returned|[*][*][*] ' build-tests.log | head -150; echo ----; tail -40 build-tests.log; exit 1; }
          tail -8 build-tests.log
          grep -E 'warning:' build-tests.log | grep -E 'tstDevPciVfio|DevPciVfio|DevPciIch9' | head -60 || true

      - name: Run device testcases
        if: inputs.flavor != 'baseline'
        run: |
          cd out/linux.amd64/release/bin/testcase
          ls -l tstDevPciVfio
          log="$GITHUB_WORKSPACE/test-tstDevPciVfio.log"
          # The fuzz test gets more to do here than it does by default, and time for it.
          limit=600
          export TSTDEVPCIVFIO_FUZZ_MODELS=2000
          if [ "${{ inputs.flavor }}" = "sanitize" ]; then
            limit=1800
            export TSTDEVPCIVFIO_FUZZ_MODELS=20000
          fi
          if [ -n "${{ inputs.fuzz_models }}" ]; then export TSTDEVPCIVFIO_FUZZ_MODELS="${{ inputs.fuzz_models }}"; fi
          if [ -n "${{ inputs.fuzz_seed }}" ]; then export TSTDEVPCIVFIO_FUZZ_SEED="${{ inputs.fuzz_seed }}"; fi
          if [ "${{ inputs.flavor }}" = "sanitize" ]; then
            # Memory errors and leaks end the run with a failure.  Undefined behaviour is
            # reported and the run goes on, the reports are looked at below.
            export ASAN_OPTIONS=detect_leaks=1:detect_stack_use_after_return=1:strict_string_checks=1
            export UBSAN_OPTIONS=print_stacktrace=1
            # Make sure the testcase really got built with them.
            ldd ./tstDevPciVfio | grep -E 'libasan|libubsan'
          fi
          ./tstDevPciVfio > "$log" 2>&1 &
          pid=$!
          # A test which hangs is stopped when the time limit is reached, with a
          # backtrace of all its threads.
          i=0
          while kill -0 $pid 2>/dev/null && [ $i -lt $limit ]; do sleep 1; i=$((i + 1)); done
          if kill -0 $pid 2>/dev/null; then
            cat "$log"
            echo "TEST HANGS, backtrace of all threads:"
            sudo timeout -k 5 60 gdb -batch -p $pid -ex "thread apply all bt" 2>&1 | tail -150 || true
            kill -9 $pid
            exit 1
          fi
          if ! wait $pid; then
            cat "$log"
            echo "TEST FAILED, running it again in the debugger for a backtrace"
            timeout -k 5 $limit gdb -batch -ex run -ex "thread apply all bt" --args ./tstDevPciVfio 2>&1 | tail -150 || true
            exit 1
          fi
          tail -n 200 "$log"
          if [ "${{ inputs.flavor }}" = "sanitize" ]; then
            # Undefined behaviour in the device, the bus code it is tested with or in the
            # test itself is a failure.
            echo "---- undefined behaviour reports: $(grep -c 'runtime error:' "$log" || true)"
            grep 'runtime error:' "$log" | sed -E 's/^.*\/src\/VBox\///' | sort | uniq -c | sort -rn | head -40 || true
            if grep -q 'runtime error:' "$log"; then exit 1; fi
          fi

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs-${{ inputs.flavor }}-${{ steps.src.outputs.head }}
          path: |
            build.log
            build-tests.log
            test-tstDevPciVfio.log
            configure.log
            configure-run.log
            configure-help.log
            AutoConfig.kmk
            LocalConfig.kmk
            env.sh
          if-no-files-found: ignore
          retention-days: 14
