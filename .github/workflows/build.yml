name: build

# Builds a ref of this repository headless on Linux.
#   flavor=baseline  plain release build, no testcases (reference result)
#   flavor=tests     release build with testcases, runs the device testcases
#   flavor=sanitize  like tests, with the device testcase and what is compiled
#                    into it built with AddressSanitizer and
#                    UndefinedBehaviorSanitizer
#   flavor=package   like tests, and then the VirtualBox which was built is
#                    made one file, which the run keeps as an artifact: for
#                    a machine with real hardware, see hw/README.md.  The
#                    workflow release.yml publishes the file of a run.
#   flavor=sim       like tests, and then the VirtualBox which was built is
#                    run with a small Linux guest: on the runner, and in a
#                    virtual machine with an emulated IOMMU and an emulated
#                    PCIe device (sim/run.sh on this branch)
#   flavor=winsim    like tests, and then the VirtualBox which was built is
#                    run on the runner with the small Linux guest and with
#                    Windows Server, which is installed from its evaluation
#                    image into a VM with an empty hot-plug capable slot;
#                    that Windows is then started in the virtual machine
#                    with the emulated IOMMU, with the emulated PCIe device
#                    in the slot (sim/win-phases.sh on this branch)
#   flavor=allsim    sim and winsim in one run: one build, and the Linux
#                    guest and Windows after each other
# Started through the API (workflow_dispatch) because the code branches do
# not carry workflow files.

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch, tag or commit of the source to build"
        required: true
        default: main
      flavor:
        description: "baseline, tests, sanitize, package, sim, winsim or allsim"
        required: true
        default: baseline
      kmk_args:
        description: "Extra arguments for kmk (optional)"
        required: false
        default: ""
      cache_ref:
        description: "Branch whose baseline build output is reused (tests and sanitize flavors)"
        required: false
        default: main
      fuzz_models:
        description: "Number of random device models for the fuzz test (default: 2000, with sanitize 20000)"
        required: false
        default: ""
      fuzz_seed:
        description: "Seed of the first random device model (default: the one built into the testcase)"
        required: false
        default: ""
      expect:
        description: "pass (default) or fail. With fail the run succeeds if the device testcase fails: for showing that a test catches what it is for, without a failed run"
        required: false
        default: pass
      sim_strict:
        description: "no (default), yes or linux. With yes a run with the simulation fails if a check of the simulation fails; with linux only if a check with the Linux guest fails, and the parts with Windows tell what they found; with no it tells what it found and succeeds, for setting the simulation up"
        required: false
        default: "no"
      explore:
        description: "no (default) or yes. With yes the run counts as passed whatever happens in it: for the first build of a branch or a base nothing is known about yet, where a failure is a finding about the workflow as likely as one about the code. The log tells what happened"
        required: false
        default: "no"
      sim_parts:
        description: "Parts of the simulation to run instead of those the flavor has, with commas (optional): runner, simhost, mfhost, barhost, vgahost, errhost, mferrhost, plughost, win, winhost, mfwinhost, hdawinhost. For a run which is about one part"
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: build-${{ inputs.ref }}-${{ inputs.flavor }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    continue-on-error: ${{ inputs.explore == 'yes' }}
    env:
      DEBIAN_FRONTEND: noninteractive
    steps:
      - name: Runner facts
        run: |
          set -x
          uname -a
          nproc
          free -g
          df -h / /mnt || true
          gcc --version | head -1
          ls -l /dev/kvm || true

      # What processor the runner has cannot be chosen, and some things show
      # on one kind only.  Of the two steps after this one exactly one runs,
      # and neither does anything: which of them ran can be read through the
      # API while the job goes on, so a run which was started for the sake of
      # one kind of processor can be cancelled in its first minute when it got
      # the other (.ci-tools/ci-cpu.sh on the machine the runs are started
      # from).
      - name: Processor of the runner
        id: cpu
        run: |
          grep -m1 'model name' /proc/cpuinfo
          if grep -q AuthenticAMD /proc/cpuinfo; then
            echo "vendor=amd" >> "$GITHUB_OUTPUT"
          else
            echo "vendor=other" >> "$GITHUB_OUTPUT"
          fi

      - name: The runner has an AMD processor
        if: steps.cpu.outputs.vendor == 'amd'
        run: "true"

      - name: The runner has another processor
        if: steps.cpu.outputs.vendor != 'amd'
        run: "true"

      - name: Check out source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          submodules: false
          # Deep enough to reach a commit of upstream below the commits of
          # the branch: the step "Source facts" takes the revision from one.
          # 50 was too few for the 7.1 branch with the KVM backend (run 257).
          fetch-depth: 300

      - name: Check out kBuild
        run: |
          # kBuild is a submodule.  The 7.1 branch has its commit in the tree and
          # no .gitmodules which says where it is from (run 241), so the checkout
          # action cannot get it; it is the same repository as for the others.
          if [ -f .gitmodules ] && grep -q 'kBuild' .gitmodules; then
            git submodule update --init --recursive
          else
            sha=$(git ls-tree HEAD kBuild | awk '{ print $3 }')
            echo "kBuild commit of this tree: $sha"
            rm -rf kBuild
            git clone -q https://github.com/VirtualBox/kbuild.git kBuild
            if ! git -C kBuild checkout -q "$sha"; then
              echo "that commit is not in the kBuild repository, using its head: $(git -C kBuild rev-parse HEAD)"
            fi
          fi
          git -C kBuild log -1 --format='kBuild %H %cs'

      - name: Source facts
        id: src
        run: |
          echo "head=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "kbuild=$(git -C kBuild rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          # The build takes the product revision from a trailer in the commit message of
          # HEAD, which commits made in this fork do not have; use the newest upstream one.
          rev=$(git log -300 --format=%B | grep -m1 -o -E '^svn:sync-xref-src-repo-rev: r[0-9]+$' | grep -o -E '[0-9]+$' || true)
          if [ -z "$rev" ]; then
            echo "no commit of upstream among the newest 300 of this branch: nothing to take the revision from"
            exit 1
          fi
          echo "VBOX_SVN_REV=$rev" >> "$GITHUB_ENV"
          echo "revision $rev"
          # The commit whose build output can be reused.
          if [ "${{ inputs.flavor }}" = "baseline" ]; then
            base=$(git rev-parse HEAD)
          else
            base=$(git ls-remote origin "refs/heads/${{ inputs.cache_ref }}" | cut -f1)
            git fetch -q --depth=1 origin "$base"
          fi
          echo "base=$base" >> "$GITHUB_OUTPUT"
          echo "gcc=$(gcc -dumpfullversion)" >> "$GITHUB_OUTPUT"
          # Give every source file the same old time stamp, then mark what differs
          # from the base as new. Together with the cached output directory of the
          # base this makes the build incremental.
          find . '(' -path ./out -o -name .git ')' -prune -o -type f -print0 | xargs -0 touch -h -d @1577836800
          if [ "$base" != "$(git rev-parse HEAD)" ]; then
            # Without the files the branch has deleted (run 237): there is nothing
            # to mark, and what was built from them is left behind by the makefiles
            # which no longer name them.
            git diff --name-only --diff-filter=d "$base" HEAD | tee changed-files.log | xargs -r touch -c
          fi
          git log -1 --format='%H %s'
          ls kBuild/kBuild/bin/linux.amd64 | head -5

      - name: Install build dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends \
            build-essential gcc-multilib g++-multilib libc6-dev-i386 \
            pkg-config \
            acpica-tools chrpath nasm yasm xsltproc libxml2-utils genisoimage makeself \
            glslang-tools python3 python3-dev gdb \
            libasound2-dev libcap-dev libcurl4-openssl-dev libdevmapper-dev \
            libpam0g-dev libpulse-dev libssl-dev zlib1g-dev libzstd-dev \
            libxml2-dev libxslt1-dev libvpx-dev libopus-dev libogg-dev libvorbis-dev \
            liblzf-dev liblzma-dev libtpms-dev libpng-dev libjpeg-dev \
            libslirp-dev libssh-dev libvncserver-dev \
            libx11-dev libxext-dev libxmu-dev libxrandr-dev libxinerama-dev \
            libxcursor-dev libxcomposite-dev libxfixes-dev libxt-dev \
            libgl-dev libglu1-mesa-dev mesa-common-dev libvulkan-dev \
            libvulkan1 mesa-vulkan-drivers vulkan-tools \
            linux-headers-$(uname -r) || \
          sudo apt-get install -y -q --no-install-recommends linux-headers-generic

      - name: Restore build output of the base
        id: outcache
        if: inputs.flavor != 'baseline'
        uses: actions/cache/restore@v4
        with:
          path: out
          key: out-v1-gcc${{ steps.src.outputs.gcc }}-${{ steps.src.outputs.base }}

      - name: Configure
        run: |
          export KBUILD_PATH="$PWD/kBuild/kBuild"
          # The runner image ships libstdc++ headers of several GCC versions and
          # configure picks the first it finds; keep only those of the default g++.
          gccmaj=$(g++ -dumpversion | cut -d. -f1)
          for d in /usr/include/c++/* /usr/include/x86_64-linux-gnu/c++/*; do
            [ "$(basename "$d")" = "$gccmaj" ] || sudo rm -rf "$d"
          done
          ls /usr/include/c++
          ./configure --help > configure-help.log 2>&1 || true
          # The development line has a configure of its own kind (configure.py is
          # its sign) which takes options for leaving the additions and the
          # validation kit out.  The configure of the maintenance branches does
          # not know these two; there LocalConfig.kmk below does it alone.  That
          # configure gets told to leave Java and the kernel modules out, which
          # nothing here needs.
          opts="--ose --build-headless --disable-docs --disable-python --disable-hardening --disable-extpack --disable-sdl"
          if [ -e configure.py ]; then
            opts="$opts --disable-additions --disable-validationkit"
          else
            # Of these it gets the ones it knows: 7.1 has no DXVK to leave out
            # (run 242).
            # --with-kvm is of a tree which has the KVM backend of Cyberus
            # Technology: with it VirtualBox runs its VMs on KVM and without its
            # kernel driver, which is what the simulation needs on a
            # maintenance branch.
            # A build with 3D acceleration for VMs is asked for with
            # VBOX_WITH_VMSVGA3D=1 among the arguments for kmk.  It keeps DXVK,
            # which is what renders for the graphics adapter of a VM on a Linux
            # host; "Local configuration" below does the rest.
            for o in --disable-java --disable-kmods --disable-dxvk --with-kvm; do
              case "$o ${{ inputs.kmk_args }}" in "--disable-dxvk "*VBOX_WITH_VMSVGA3D=1*) continue ;; esac
              if grep -q -E "^ +${o}\)|\|${o}\)|^ +${o}\|" configure; then opts="$opts $o"; fi
            done
            # Where kBuild is: the configure of 7.1 looks one directory too high
            # for a kBuild which comes from its repository (run 243).
            opts="$opts --with-kbuild=$KBUILD_PATH"
          fi
          echo "configure $opts"
          # The tool checks of configure run into their time limits now and then, so
          # it gets up to three attempts.
          configured=no
          for attempt in 1 2 3; do
            if ./configure $opts > configure-run.log 2>&1; then
              configured=yes
              break
            fi
            echo "configure attempt $attempt failed:"; grep -E 'ERROR|failed|Unrecognized' configure-run.log | head -5 || true
            # Another attempt does not help against an option it does not know.
            if grep -q 'Unrecognized option' configure-run.log; then break; fi
          done
          if [ "$configured" != yes ]; then cat configure-run.log; tail -100 configure.log || true; exit 1; fi
          cat configure-run.log
          echo "---- AutoConfig.kmk"; cat AutoConfig.kmk
          echo "---- env.sh"; cat env.sh

      - name: Local configuration
        run: |
          {
            echo "VBOX_WITH_DOCS :="
            echo "VBOX_WITH_ADDITIONS :="
            echo "VBOX_WITH_VALIDATIONKIT :="
            echo "VBOX_WITH_WEBSERVICES :="
            echo "VBOX_WITH_UPDATE_AGENT :="
            echo "VBOX_WITH_TESTCASES :="
            # The 2D video acceleration for guests, which the lines after 7.1 no
            # longer have.  The 7.1 branches are built without it as well; on
            # the others the switch is about nothing.
            echo "VBOX_WITH_VIDEOHWACCEL :="
            # The configure of the development line switches the translations off
            # when there is no Qt, whose lrelease builds them.  The older one
            # leaves them on (run 235).
            if [ ! -e configure.py ]; then
              echo "override VBOX_WITH_NLS :="
              echo "VBOX_WITH_MAIN_NLS :="
              echo "VBOX_WITH_PUEL_NLS :="
              echo "VBOX_WITH_VBOXMANAGE_NLS :="
            fi
            # 3D acceleration for VMs, where the run asks for it.  A build
            # without a user interface has it switched off by configure; here
            # it is switched on again for every step which builds, not only
            # for the one which gets the arguments for kmk.
            case "${{ inputs.kmk_args }}" in
              *VBOX_WITH_VMSVGA3D=1*)
                echo "VBOX_WITH_VMSVGA3D := 1"
                echo "VBOX_WITH_3D_ACCELERATION := 1"
                ;;
            esac
            # The whole build with the sanitizers of GCC for addresses and
            # undefined behaviour, where the run asks for it with
            # VBOX_WITH_GCC_SANITIZER=1 among the arguments for kmk: for a
            # simulation whose VMs run with them.  Nearly every file is
            # compiled anew then, whatever the build of the base has.
            case "${{ inputs.kmk_args }}" in
              *VBOX_WITH_GCC_SANITIZER=1*)
                echo "VBOX_WITH_GCC_SANITIZER := 1"
                ;;
            esac
          } > LocalConfig.kmk
          case "${{ inputs.kmk_args }}" in
            *VBOX_WITH_GCC_SANITIZER=1*)
              # Programs which are built and run while the tree is built are
              # built with the sanitizers too.  Memory they have not freed
              # when they end is no reason for the build to stop.
              echo "ASAN_OPTIONS=detect_leaks=0" >> "$GITHUB_ENV"
              # A program with the address sanitizer does not find a library
              # it loads while it runs next to itself any more (Config.kmk
              # tells of it), so it is told where the libraries are.
              echo "LD_LIBRARY_PATH=$GITHUB_WORKSPACE/out/linux.amd64/release/bin" >> "$GITHUB_ENV"
              ;;
          esac
          cat LocalConfig.kmk
          touch -d @1577836800 LocalConfig.kmk AutoConfig.kmk env.sh

      - name: Build
        run: |
          . ./env.sh
          which kmk
          kmk --version > kmk-version.log 2>&1 || true
          sed -n '1,3p' kmk-version.log
          # An exploring run goes on after a file which does not compile, so that
          # one run tells about all of them.
          keepgoing=
          if [ "${{ inputs.explore }}" = "yes" ]; then keepgoing=-k; fi
          if ! ( time kmk -j"$(nproc)" $keepgoing KBUILD_TYPE=release ${{ inputs.kmk_args }} ) > build.log 2>&1; then
            echo "BUILD FAILED"
            grep -n -E '(^|[^a-zA-Z])(error|Error|\*\*\*)[: ]' build.log | head -150 || true
            echo ----
            tail -120 build.log
            # With the baseline flavor that is it.  The other flavors go on to the device
            # testcases where they can, so that one run tells as much as possible, and
            # fail at the end.
            if [ "${{ inputs.flavor }}" = "baseline" ]; then exit 1; fi
            touch build-failed
          fi
          tail -15 build.log
          grep -c -E 'warning:' build.log || true

      - name: Save build output
        if: inputs.flavor == 'baseline'
        uses: actions/cache/save@v4
        with:
          path: out
          key: out-v1-gcc${{ steps.src.outputs.gcc }}-${{ steps.src.outputs.base }}

      - name: Build result facts
        if: always()
        run: |
          ls out/linux.amd64/release/bin 2>/dev/null | head -80 || true
          du -sh out 2>/dev/null || true
          df -h /

      - name: Build device testcases
        if: inputs.flavor != 'baseline' && !contains(inputs.kmk_args, 'VBOX_WITH_GCC_SANITIZER=1')
        run: |
          . ./env.sh
          # The sanitizers go in through properties of the target which the makefile
          # doesn't set, so nothing has to be changed in the source tree for them.
          extra=()
          if [ "${{ inputs.flavor }}" = "sanitize" ]; then
            san="-fsanitize=address,undefined -fno-omit-frame-pointer"
            extra=("tstDevPciVfio_CXXFLAGS.linux=$san" "tstDevPciVfio_LDFLAGS.linux=$san")
          fi
          ( time kmk -C src/VBox/Devices -k -j"$(nproc)" KBUILD_TYPE=release VBOX_WITH_TESTCASES=1 "${extra[@]}" ) > build-tests.log 2>&1 \
            || { echo "TESTCASE BUILD FAILED"; grep -n -E 'error:|undefined reference|multiple definition|ld returned|[*][*][*] ' build-tests.log | head -150; echo ----; tail -40 build-tests.log; exit 1; }
          tail -8 build-tests.log
          grep -E 'warning:' build-tests.log | grep -E 'tstDevPciVfio|DevPciVfio|DevPciIch9' | head -60 || true

      - name: Run device testcases
        if: inputs.flavor != 'baseline' && !contains(inputs.kmk_args, 'VBOX_WITH_GCC_SANITIZER=1')
        run: |
          # A branch which is not about the passthrough device does not have its testcase.
          if [ ! -e src/VBox/Devices/testcase/tstDevPciVfio.cpp ]; then
            echo "This tree does not have the testcase of the passthrough device."
            exit 0
          fi
          cd out/linux.amd64/release/bin/testcase
          ls -l tstDevPciVfio
          log="$GITHUB_WORKSPACE/test-tstDevPciVfio.log"
          # The fuzz test gets more to do here than it does by default, and time for it.
          limit=600
          export TSTDEVPCIVFIO_FUZZ_MODELS=2000
          if [ "${{ inputs.flavor }}" = "sanitize" ]; then
            limit=1800
            export TSTDEVPCIVFIO_FUZZ_MODELS=20000
          fi
          if [ -n "${{ inputs.fuzz_models }}" ]; then export TSTDEVPCIVFIO_FUZZ_MODELS="${{ inputs.fuzz_models }}"; fi
          if [ -n "${{ inputs.fuzz_seed }}" ]; then export TSTDEVPCIVFIO_FUZZ_SEED="${{ inputs.fuzz_seed }}"; fi
          if [ "${{ inputs.flavor }}" = "sanitize" ]; then
            # Memory errors and leaks end the run with a failure.  Undefined behaviour is
            # reported and the run goes on, the reports are looked at below.
            export ASAN_OPTIONS=detect_leaks=1:detect_stack_use_after_return=1:strict_string_checks=1
            export UBSAN_OPTIONS=print_stacktrace=1
            # Make sure the testcase really got built with them.
            ldd ./tstDevPciVfio | grep -E 'libasan|libubsan'
          fi
          ./tstDevPciVfio > "$log" 2>&1 &
          pid=$!
          # A test which hangs is stopped when the time limit is reached, with a
          # backtrace of all its threads.
          i=0
          while kill -0 $pid 2>/dev/null && [ $i -lt $limit ]; do sleep 1; i=$((i + 1)); done
          if kill -0 $pid 2>/dev/null; then
            cat "$log"
            echo "TEST HANGS, backtrace of all threads:"
            sudo timeout -k 5 60 gdb -batch -p $pid -ex "thread apply all bt" 2>&1 | tail -150 || true
            kill -9 $pid
            exit 1
          fi
          if ! wait $pid; then
            cat "$log"
            if [ "${{ inputs.expect }}" = "fail" ]; then
              echo "TEST FAILED, which is what this run was to show"
              exit 0
            fi
            echo "TEST FAILED, running it again in the debugger for a backtrace"
            timeout -k 5 $limit gdb -batch -ex run -ex "thread apply all bt" --args ./tstDevPciVfio 2>&1 | tail -150 || true
            exit 1
          fi
          if [ "${{ inputs.expect }}" = "fail" ]; then
            tail -n 60 "$log"
            echo "TEST PASSED although this run was to show it failing"
            exit 1
          fi
          tail -n 200 "$log"
          if [ "${{ inputs.flavor }}" = "sanitize" ]; then
            # Undefined behaviour in the device, the bus code it is tested with or in the
            # test itself is a failure.
            echo "---- undefined behaviour reports: $(grep -c 'runtime error:' "$log" || true)"
            grep 'runtime error:' "$log" | sed -E 's/^.*\/src\/VBox\///' | sort | uniq -c | sort -rn | head -40 || true
            if grep -q 'runtime error:' "$log"; then exit 1; fi
          fi

      - name: Check the ACPI table
        if: inputs.flavor != 'baseline'
        run: |
          # The DSDT as built, decompiled and executed with the ACPICA tools: what the
          # PCI root bridge calls itself and what _OSC grants the guest, without and
          # with PCI Express native hot-plug being configured.
          hex=$(find out/linux.amd64/release/obj/VBoxDD -name vboxaml.hex | head -1)
          ls -l "$hex"
          mkdir -p acpi-check
          cd acpi-check
          python3 - "../$hex" dsdt.aml <<'EOF'
          import re, sys
          src = re.sub(r'/\*.*?\*/', '', open(sys.argv[1]).read(), flags=re.S)
          src = re.sub(r'//[^\n]*', '', src)
          body = src[src.index('{') + 1:src.rindex('}')]
          data = bytes(int(x, 16) for x in re.findall(r'0x([0-9A-Fa-f]{1,2})\b', body))
          assert data[:4] == b'DSDT', data[:16]
          assert int.from_bytes(data[4:8], 'little') == len(data), (len(data), data[4:8])
          open(sys.argv[2], 'wb').write(data)
          print(len(data), 'bytes of AML')
          EOF
          iasl -d dsdt.aml > iasl.log 2>&1 || { cat iasl.log; exit 1; }
          tail -3 iasl.log
          if ! grep -q 'PEHP' dsdt.dsl; then
            echo "The table has no field for PCI Express native hot-plug, nothing more to check."
            exit 0
          fi
          osc='execute \_SB.PCI0._OSC (5B 4D DB 33 F7 1F 1C 40 96 57 74 41 C0 3D D7 66) 1 3 (00 00 00 00 1F 00 00 00 1F 00 00 00)'
          # Operation regions which read as zero: not configured.
          acpiexec -di -b 'execute \_SB.PCI0._HID' dsdt.aml > hid-off.log 2>&1 || true
          acpiexec -di -b "$osc" dsdt.aml > osc-off.log 2>&1 || true
          # Operation regions which read as all ones: configured.
          acpiexec -di -fv 0xff -b 'execute \_SB.PCI0._HID' dsdt.aml > hid-on.log 2>&1 || true
          acpiexec -di -fv 0xff -b "$osc" dsdt.aml > osc-on.log 2>&1 || true
          for f in hid-off hid-on osc-off osc-on; do echo "---- $f"; grep -v '^$' $f.log | tail -8; done
          echo "---- checks"
          grep -i '030AD041' hid-off.log
          grep -i '080AD041' hid-on.log
          grep -i -E '10 00 00 00 1F 00 00 00 +0F 00 00 00' osc-off.log
          grep -i -E '00 00 00 00 1F 00 00 00 +1F 00 00 00' osc-on.log
          grep -E 'Name \(_CID, EisaId \("PNP0A03"\)' dsdt.dsl
          echo "ACPI table check passed"

      - name: Testcases of the tree
        if: inputs.flavor != 'baseline' && !contains(inputs.kmk_args, 'VBOX_WITH_GCC_SANITIZER=1')
        run: |
          . ./env.sh
          # Testcases which the tree has for code the branches for 7.1 took
          # changes to from 7.2: the services a guest talks to and the code
          # they share, the image formats, and some of the devices.  A
          # testcase which fails does not end the run here, what comes after
          # this step is to run whatever these tell; the last step of the run
          # fails for one which counts.  One which is here for the first time,
          # or which the test driver of the tree itself leaves out, is tried:
          # what it does is told and does not count.  All of them passed in
          # run 260.
          errpat='error:|undefined reference|multiple definition|ld returned|[*][*][*] '
          ( time kmk -C src/VBox/HostServices -k -j"$(nproc)" KBUILD_TYPE=release VBOX_WITH_TESTCASES=1 ) > build-hostsvc-tests.log 2>&1 \
            || { echo "NOT EVERYTHING WAS BUILT (host services)"; grep -n -E "$errpat" build-hostsvc-tests.log | head -80; }
          tail -4 build-hostsvc-tests.log
          ( time kmk -C src/VBox/Storage -k -j"$(nproc)" KBUILD_TYPE=release VBOX_WITH_TESTCASES=1 ) > build-storage-tests.log 2>&1 \
            || { echo "NOT EVERYTHING WAS BUILT (storage)"; grep -n -E "$errpat" build-storage-tests.log | head -80; }
          tail -4 build-storage-tests.log
          bin="$GITHUB_WORKSPACE/out/linux.amd64/release/bin/testcase"
          work="$GITHUB_WORKSPACE/tc-work"
          mkdir -p "$work"
          # run_tc <counts|tried> <name> <its source file> <directory to run it in>
          run_tc() {
            kind=$1; t=$2; src=$3; dir=$4
            log="$GITHUB_WORKSPACE/test-tc-$t.log"
            if [ ! -e "$src" ]; then
              echo "TESTCASE $t: this tree does not have it"
              return 0
            fi
            if [ ! -x "$bin/$t" ]; then
              echo "TESTCASE $t: NOT BUILT ($kind)"
              if [ "$kind" = counts ]; then echo "$t (not built)" >> testcases-failed; fi
              return 0
            fi
            rc=0
            ( cd "$dir" && timeout -k 5 300 "$bin/$t" ) > "$log" 2>&1 || rc=$?
            if [ "$rc" = 0 ]; then
              echo "TESTCASE $t: passed ($kind): $(grep -v '^$' "$log" | tail -n 1 | cut -c1-120)"
            elif [ "$kind" = counts ]; then
              echo "TESTCASE $t: FAILED with exit code $rc"
              tail -n 40 "$log"
              echo "$t (exit code $rc)" >> testcases-failed
            else
              echo "TESTCASE $t: failed with exit code $rc (tried, does not count)"
              tail -n 25 "$log"
            fi
            return 0
          }
          hs=src/VBox/HostServices
          # The services.
          run_tc counts tstHGCMSvc              $hs/testcase/tstHGCMSvc.cpp "$bin"
          run_tc counts tstGuestPropSvc         $hs/GuestProperties/testcase/tstGuestPropSvc.cpp "$bin"
          run_tc counts tstClipboardServiceHost $hs/SharedClipboard/testcase/tstClipboardServiceHost.cpp "$bin"
          run_tc counts tstClipboardServiceImpl $hs/SharedClipboard/testcase/tstClipboardServiceImpl.cpp "$bin"
          run_tc counts tstSharedFolderService  $hs/SharedFolders/testcase/tstSharedFolderService.cpp "$bin"
          run_tc counts tstShflCase             $hs/SharedFolders/testcase/tstShflCase.cpp "$bin"
          run_tc counts tstShflSizes            $hs/SharedFolders/testcase/tstShflSizes.cpp "$bin"
          # The testcase of the guest control service as upstream has it ends in
          # its first connect, on every branch, and the test driver of the tree
          # leaves it out.  The branches for 7.1 have it repaired; the repaired
          # one gives its client the memory whose size the service tells.
          gc=$hs/GuestControl/testcase/tstGuestControlSvc.cpp
          if [ -e "$gc" ] && ! grep -q 'cbClient' "$gc"; then
            echo "TESTCASE tstGuestControlSvc: not run: this tree has it as upstream does, and that one cannot run"
          else
            run_tc counts tstGuestControlSvc $gc "$bin"
          fi
          run_tc counts tstGuestControlMockHGCM $hs/GuestControl/testcase/tstGuestControlMockHGCM.cpp "$bin"
          run_tc counts tstClipboardTransfers  $hs/SharedClipboard/testcase/tstClipboardTransfers.cpp "$bin"
          # The image formats; these write their images into the directory they run in.
          st=src/VBox/Storage/testcase
          run_tc counts tstVD-2   $st/tstVD-2.cpp "$work"
          run_tc counts tstVDIo   $st/tstVDIo.cpp "$work"
          run_tc counts tstVDSnap $st/tstVDSnap.cpp "$work"
          # Devices; the step before this one built them.  The test driver of
          # the tree leaves the one of the internal network out, which measures
          # a throughput for a minute: it stays one which is tried.
          dv=src/VBox/Devices
          run_tc counts tstAudioMixBuffer $dv/Audio/testcase/tstAudioMixBuffer.cpp "$bin"
          run_tc counts tstUsbMouse       $dv/Input/testcase/tstUsbMouse.cpp "$bin"
          run_tc tried  tstIntNetR0       $dv/Network/testcase/tstIntNetR0.cpp "$bin"
          rm -rf "$work"

      - name: Command line checks
        if: inputs.flavor != 'baseline' && !contains(inputs.kmk_args, 'VBOX_WITH_GCC_SANITIZER=1')
        run: |
          # VBoxManage of the build with a VBoxSVC of its own, for settings which
          # need no VM to run.  A check which fails does not end the run here;
          # one which counts fails the last step, as with the testcases of the
          # tree.  A check which is here for the first time is tried: what it
          # does is told and does not count.
          bin="$GITHUB_WORKSPACE/out/linux.amd64/release/bin"
          if [ ! -x "$bin/VBoxManage" ]; then
            echo "CLI: there is no VBoxManage, nothing to check"
            exit 0
          fi
          export VBOX_USER_HOME="$RUNNER_TEMP/vbox-cli"
          rm -rf "$VBOX_USER_HOME"
          mkdir -p "$VBOX_USER_HOME"
          vbm() { timeout -k 10 120 "$bin/VBoxManage" "$@"; }
          # try <arguments of VBoxManage>: tells the command and its exit code, which it returns.
          try() {
            local rc=0
            vbm "$@" > cli-last.log 2>&1 || rc=$?
            echo "+ VBoxManage $* -> $rc"
            if [ "$rc" != 0 ]; then grep -v '^$' cli-last.log | head -n 4 | cut -c1-200 | sed 's/^/    /'; fi
            return "$rc"
          }
          field() { vbm showvminfo cli --machinereadable 2> /dev/null | sed -n "s/^$1=\"\{0,1\}\([^\"]*\)\"\{0,1\}\$/\1/p" | head -n 1; }
          # The graphics controller, the 3D acceleration and the video memory of the VM.
          state() { echo "$(field graphicscontroller),$(field accelerate3d),$(field vram)"; }
          # result <counts|tried> <what> <ok|failed> [<note>]
          result() {
            if [ "$3" = ok ]; then
              echo "CLI $2: passed ($1)${4:+: $4}"
            elif [ "$1" = counts ]; then
              echo "CLI $2: FAILED${4:+: $4}"
              echo "command line: $2" >> testcases-failed
            else
              echo "CLI $2: failed (tried, does not count)${4:+: $4}"
            fi
          }
          # expect <counts|tried> <what> <ok|refused> <state afterwards> <arguments of modifyvm>
          expect() {
            local kind=$1 what=$2 how=$3 want=$4 rc=0 s
            shift 4
            try modifyvm cli "$@" || rc=$?
            s=$(state)
            if [ "$how" = ok ] && [ "$rc" = 0 ] && [ "$s" = "$want" ]; then
              result "$kind" "$what" ok
            elif [ "$how" = refused ] && [ "$rc" != 0 ] && [ "$s" = "$want" ]; then
              result "$kind" "$what" ok "refused, and the VM is as it was"
            else
              result "$kind" "$what" failed "exit code $rc, the VM has $s, expected $want and the command to be $how"
            fi
          }
          if ! try createvm --name cli --ostype Linux_64 --register; then
            echo "CLI: no VM could be created with this build, nothing to check"
            head -n 20 cli-last.log
            exit 0
          fi
          echo "    the VM as created: $(state)"

          # modifyvm: the 3D acceleration and the size of the video memory go by
          # the graphics controller of the same command, wherever that stands.
          if ! grep -q 'iAccelerate3D' src/VBox/Frontends/VBoxManage/VBoxManageModifyVM.cpp 2> /dev/null; then
            echo "CLI: this tree applies the graphics options of modifyvm in the order they are given, which is not checked"
          else
            # All six passed in run 281, a build with 3D acceleration; the two
            # without it in run 280.
            kind=counts
            # The video memory: VBoxVGA takes 1 MB, VMSVGA does not.
            try modifyvm cli --graphicscontroller vboxvga --vram 8 || true
            expect $kind "video memory too small for the graphics controller which follows it" refused vboxvga,off,8 \
              --vram 1 --graphicscontroller vmsvga
            try modifyvm cli --graphicscontroller vmsvga --vram 8 || true
            expect $kind "video memory which fits the graphics controller which follows it" ok vboxvga,off,1 \
              --vram 1 --graphicscontroller vboxvga
            # The 3D acceleration, where the build has it.
            try modifyvm cli --graphicscontroller vmsvga --vram 16 --accelerate-3d on || true
            if [ "$(state)" != vmsvga,on,16 ]; then
              echo "CLI: this build has no 3D acceleration for VMSVGA, the checks with it are left out ($(state))"
            else
              try modifyvm cli --graphicscontroller vboxvga --vram 16 || true
              expect $kind "3D acceleration in front of the graphics controller which has it" ok vmsvga,on,16 \
                --accelerate-3d on --graphicscontroller vmsvga
              try modifyvm cli --graphicscontroller vmsvga --accelerate-3d off --vram 16 || true
              expect $kind "3D acceleration in front of a graphics controller which does not have it" refused vmsvga,off,16 \
                --accelerate-3d on --graphicscontroller vboxvga
              try modifyvm cli --graphicscontroller vboxvga --vram 8 || true
              expect $kind "video memory too small for the 3D acceleration which follows it" refused vboxvga,off,8 \
                --vram 8 --graphicscontroller vmsvga --accelerate-3d on
              try modifyvm cli --graphicscontroller vmsvga --accelerate-3d on --vram 16 || true
              expect $kind "video memory which fits once the 3D acceleration which follows it is off" ok vmsvga,off,8 \
                --vram 8 --accelerate-3d off
            fi
          fi

          # modifynvram: the firmware of a VM is asked to enter its setup at the
          # next start, through the variable OsIndications of the UEFI
          # specification.  That the firmware goes by it is for the simulation
          # to show (the phase "fwsetup"); here it is what the command writes.
          if ! grep -q 'firmwaresetup' src/VBox/Frontends/VBoxManage/VBoxManageModifyNvram.cpp 2> /dev/null; then
            echo "CLI: this tree has no modifynvram firmwaresetup, which is not checked"
          else
            # All eight passed in run 325.
            kind=counts
            # OsIndications as hexadecimal bytes, "none" if the VM has no such variable.
            osind() {
              rm -f cli-osind.bin
              if vbm modifynvram cli queryvar --name OsIndications --filename cli-osind.bin > /dev/null 2>&1 && [ -e cli-osind.bin ]; then
                od -A n -t x1 cli-osind.bin | tr -d ' \n'
                echo
              else
                echo none
              fi
            }
            # nvram <counts|tried> <what> <ok|refused> <OsIndications afterwards> <arguments of modifynvram>
            nvram() {
              local kind=$1 what=$2 how=$3 want=$4 rc=0 s
              shift 4
              try modifynvram cli "$@" || rc=$?
              s=$(osind)
              if [ "$how" = ok ] && [ "$rc" = 0 ] && [ "$s" = "$want" ]; then
                result "$kind" "$what" ok
              elif [ "$how" = refused ] && [ "$rc" != 0 ] && [ "$s" = "$want" ]; then
                result "$kind" "$what" ok "refused, and the variable is as it was"
              else
                result "$kind" "$what" failed "exit code $rc, OsIndications is $s, expected $want and the command to be $how"
              fi
            }
            try modifyvm cli --firmware efi || true
            nvram $kind "the setup of the firmware asked for where the VM has no variable store" refused none \
              firmwaresetup --enable
            try modifynvram cli inituefivarstore || true
            echo "    the variable store as made: OsIndications is $(osind)"
            nvram $kind "nothing to take back where nothing was asked for" ok none \
              firmwaresetup --disable
            nvram $kind "the setup of the firmware is asked for" ok 0100000000000000 \
              firmwaresetup --enable
            nvram $kind "the setup of the firmware is asked for a second time" ok 0100000000000000 \
              firmwaresetup --enable
            nvram $kind "the request is taken back" ok 0000000000000000 \
              firmwaresetup --disable
            nvram $kind "neither asked for nor taken back" refused 0000000000000000 \
              firmwaresetup
            # The other bits of the variable are not the command's.
            printf '\004\000\000\000\000\000\000\000' > cli-osind-in.bin
            try modifynvram cli changevar --name OsIndications --filename cli-osind-in.bin || true
            nvram $kind "asked for with another bit of the variable set" ok 0500000000000000 \
              firmwaresetup --enable
            nvram $kind "taken back with another bit of the variable set" ok 0400000000000000 \
              firmwaresetup --disable
          fi

          vbm unregistervm cli --delete > /dev/null 2>&1 || true
          # VBoxSVC ends by itself when nothing uses it any more; nobody waits for that here.
          pkill -x VBoxSVC 2> /dev/null || true
          pkill -x VBoxXPCOMIPCD 2> /dev/null || true

      - name: Result of the build of the tree
        if: inputs.flavor != 'baseline'
        run: |
          if [ -e build-failed ]; then
            echo "The build of the tree failed, see the step Build. What came after it used what was built."
            exit 1
          fi
          echo "The tree was built."

      - name: Package the build
        if: inputs.flavor == 'package'
        run: |
          # The VirtualBox which was built, as one file: the directory it runs
          # from, without the testcases, and a text in it which says what it is
          # and what it needs.
          sha=$(git rev-parse HEAD)
          # A build with 3D acceleration for VMs has a name of its own: there
          # can be one with and one without of the same commit.
          kind=
          if grep -q '^VBOX_WITH_VMSVGA3D := 1' LocalConfig.kmk; then kind=-3d; fi
          name="vbox-${sha:0:12}${kind}-ubuntu2404"
          rel=out/linux.amd64/release
          {
            echo "An unofficial test build of VirtualBox from a fork, not a release of Oracle."
            echo "source: https://github.com/${{ github.repository }} at commit $sha (built as ${{ inputs.ref }})"
            echo "licence: GPL-3.0-only, as VirtualBox; the source of this build is that commit"
            echo "built: $(date -u '+%Y-%m-%d %H:%M UTC') on $(sed -n 's/^PRETTY_NAME="\(.*\)"$/\1/p' /etc/os-release), gcc $(gcc -dumpfullversion)"
            # AutoConfig.kmk has the command line of configure in a comment, with
            # quotes around it and "./" in front on the lines before the
            # development line.
            # Without the option which names a place on the runner.
            echo "configure: $(grep -m 1 -E "^#   '?(\./)?configure(\.py)? " AutoConfig.kmk | sed -e "s/^#   '\{0,1\}\(\.\/\)\{0,1\}configure\(\.py\)\{0,1\} *//" -e "s/'\$//" -e 's/ --with-kbuild=[^ ]*//')"
            echo "kvm backend of the build: $(grep -E '^VBOX_WITH_KVM' AutoConfig.kmk | tr -s ' ' | tr '\n' ' ')"
            echo "3D acceleration for VMs: $(if grep -q '^VBOX_WITH_VMSVGA3D := 1' LocalConfig.kmk; then echo "yes, it takes a graphics card with a Vulkan driver on the host"; else echo no; fi)"
            echo "It runs from its directory, without installation and without kernel modules of VirtualBox."
            echo
            echo "packages of Ubuntu 24.04 with the libraries its programs need at run time:"
            find "$rel/bin" -maxdepth 2 -type f \( -name '*.so' -o -perm -u+x \) ! -path '*/testcase/*' -print0 \
              | xargs -0 ldd 2> /dev/null | awk '$2 == "=>" && $3 ~ /^\// { print $3 }' | sort -u \
              | sed -e 's#^/lib/#/usr/lib/#' | xargs -r dpkg -S 2> /dev/null | sed -e 's/: .*$//' -e 's/:amd64$//' | sort -u | tr '\n' ' ' || true
            echo
          } > "$rel/bin/BUILD-INFO.txt"
          cat "$rel/bin/BUILD-INFO.txt"
          tar -C "$rel" --exclude=bin/testcase -cf - bin | zstd -q -T0 -9 -o "$name.tar.zst"
          ls -l "$name.tar.zst"
          sha256sum "$name.tar.zst" | tee "$name.tar.zst.sha256"

      - name: Upload the package
        if: inputs.flavor == 'package'
        uses: actions/upload-artifact@v4
        with:
          name: package-${{ steps.src.outputs.head }}
          path: |
            vbox-*-ubuntu2404.tar.zst
            vbox-*-ubuntu2404.tar.zst.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

      - name: Check out the simulation scripts
        if: inputs.flavor == 'sim' || inputs.flavor == 'winsim' || inputs.flavor == 'allsim'
        uses: actions/checkout@v4
        with:
          ref: meta
          path: ci-meta
          sparse-checkout: |
            sim
            tools
            hw

      # The simulation runs the generic kernel of the distribution, whose
      # packages it fetches.  Fetching them took seconds in most runs and
      # close to an hour in two (runs 308 and 311), so they are kept from one
      # run to the next, by the version of the kernel.
      - name: Which kernel the simulation runs
        id: kpkg
        if: inputs.flavor == 'sim' || inputs.flavor == 'winsim' || inputs.flavor == 'allsim'
        run: |
          img=
          for meta in linux-image-generic-hwe-24.04 linux-image-generic; do
            img=$(apt-cache depends "$meta" 2> /dev/null \
                  | awk '$1 == "Depends:" && $2 ~ /^linux-image-[0-9].*-generic$/ { print $2; exit }')
            [ -n "$img" ] && break
          done
          echo "the generic kernel of the distribution: ${img#linux-image-}"
          echo "kver=${img#linux-image-}" >> "$GITHUB_OUTPUT"

      - name: Packages of that kernel from an earlier run
        if: (inputs.flavor == 'sim' || inputs.flavor == 'winsim' || inputs.flavor == 'allsim') && steps.kpkg.outputs.kver != ''
        uses: actions/cache@v4
        with:
          path: kdeb-cache
          key: kdeb-v1-${{ steps.kpkg.outputs.kver }}

      - name: Simulation
        if: inputs.flavor == 'sim' || inputs.flavor == 'winsim' || inputs.flavor == 'allsim'
        # Everything in the script has a time limit of its own.  With sim and
        # with winsim they add up to less than this one; with allsim they do
        # if not every part takes all the time it may.
        timeout-minutes: 300
        continue-on-error: ${{ inputs.sim_strict != 'yes' && inputs.sim_strict != 'linux' }}
        env:
          SIM_STRICT: ${{ inputs.sim_strict }}
          SIM_3D: ${{ contains(inputs.kmk_args, 'VBOX_WITH_VMSVGA3D=1') && 'yes' || 'no' }}
          SIM_SANITIZED: ${{ contains(inputs.kmk_args, 'VBOX_WITH_GCC_SANITIZER=1') && 'yes' || 'no' }}
          SIM_PARTS: ${{ inputs.sim_parts != '' && inputs.sim_parts || inputs.flavor == 'winsim' && 'runner,win,winhost,mfwinhost,hdawinhost' || inputs.flavor == 'allsim' && 'runner,simhost,mfhost,barhost,vgahost,errhost,mferrhost,win,winhost,mfwinhost,hdawinhost' || 'runner,simhost,mfhost,barhost,vgahost,errhost,mferrhost' }}
        run: bash ci-meta/sim/run.sh

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs-${{ inputs.flavor }}-${{ steps.src.outputs.head }}
          path: |
            build.log
            build-tests.log
            build-hostsvc-tests.log
            build-storage-tests.log
            test-tstDevPciVfio.log
            test-tc-*.log
            configure.log
            configure-run.log
            configure-help.log
            AutoConfig.kmk
            LocalConfig.kmk
            env.sh
            sim-out/
          if-no-files-found: ignore
          retention-days: 14

      - name: Result of the testcases of the tree
        if: inputs.flavor != 'baseline'
        run: |
          if [ -e testcases-failed ]; then
            echo "Testcases which failed or were not built:"
            cat testcases-failed
            exit 1
          fi
          echo "No testcase which counts failed."
